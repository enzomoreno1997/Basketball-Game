<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VCA 3-Point Shootout</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px;min-height:100vh}
h1{font-size:1.2rem;color:#ff6600;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
#wrap{position:relative;width:100%;max-width:450px}
canvas{width:100%;display:block;border:3px solid #fff;border-radius:12px;touch-action:none;background:#222}
#hud{display:flex;justify-content:space-between;width:100%;max-width:450px;font-weight:bold;padding:6px 4px;font-size:.95rem}
#hud span{color:#fc0}
#spots{display:flex;gap:6px;width:100%;max-width:450px;margin-top:8px}
button{padding:10px;font-size:.9rem;font-weight:bold;border:none;border-radius:6px;background:#333;color:#fff;flex:1;cursor:pointer}
button.on{background:#f60}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.85);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}
.ov h2{color:#fc0;font-size:1.8rem}
.ov p{color:#ccc;font-size:.9rem;line-height:1.4}
.ov button{flex:none;background:#f60;padding:12px 22px}
#tip{font-size:.8rem;color:#aaa;margin-top:8px;text-align:center}
#pick{display:flex;gap:6px;width:100%;max-width:450px;margin-top:8px}
#pick label{flex:1;font-size:.8rem;color:#ccc;display:flex;flex-direction:column;gap:3px}
#pick select{padding:8px;border-radius:6px;background:#333;color:#fff;border:1px solid #777;font-size:.9rem}
</style>
</head>
<body>
<h1>VCA 3-Point Shootout</h1>
<div id="hud"><div>Score: <span id="sc">0</span></div><div>Spot: <span id="sp">Wing 3PT</span></div><div>Oras: <span id="tm">2:00</span></div></div>
<div id="wrap">
<canvas id="c" width="450" height="480"></canvas>
<div id="start" class="ov"><h2>VCA Shootout</h2><p>I-drag paatras (parang tirador) at bitawan para mag-shoot. May backboard, rim bounce at roll na!</p><button onclick="startGame()">Simulan</button></div>
<div id="over" class="ov" style="display:none"><h2>Tapos na!</h2><p>Final Score: <b id="fs" style="color:#fc0">0</b></p><button onclick="startGame()">Maglaro Uli</button></div>
</div>
<div id="pick"><label>Player<select id="ps"></select></label><label>Defender<select id="ds"></select></label></div>
<div id="spots"></div>
<div id="tip">💡 I-drag palayo sa ring, may guide na tuldok. Iwasan ang defender, i-arko ang tira!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=450,H=480,R=12,G=0.3,GY=410;
const RIM={fx:362,bx:410,y:190},BB={x:410,w:8,t:105,b:200};
const SPOTS={short:{x:285,pts:2,name:'Mid 2PT'},wing:{x:140,pts:3,name:'Wing 3PT'},deep:{x:50,pts:4,name:'Logo 4PT'}};
let spot='wing',pi=0,di=1,score=0,timeLeft=120,playing=false,timer=null,sway=0,pop=null;
const b={x:0,y:0,vx:0,vy:0,rot:0,active:false,scored:false,hit:false,landed:false,landT:0,frames:0};
let drag=null;

// spot buttons
const sb=document.getElementById('spots');
for(const k in SPOTS){const e=document.createElement('button');e.textContent=SPOTS[k].name;e.dataset.k=k;e.onclick=()=>setSpot(k);sb.appendChild(e)}
function setSpot(k){spot=k;document.getElementById('sp').textContent=SPOTS[k].name;[...sb.children].forEach(e=>e.classList.toggle('on',e.dataset.k===k));if(!b.active)resetBall()}
function resetBall(){b.x=SPOTS[spot].x;b.y=335;b.vx=b.vy=0;b.active=false;b.scored=false;b.hit=false;b.blocked=false;b.landed=false;b.frames=0}
function startGame(){document.getElementById('start').style.display='none';document.getElementById('over').style.display='none';score=0;timeLeft=120;document.getElementById('sc').textContent=0;document.getElementById('tm').textContent=fmt(120);playing=true;resetBall();clearInterval(timer);timer=setInterval(()=>{timeLeft--;document.getElementById('tm').textContent=fmt(timeLeft);if(timeLeft<=0){clearInterval(timer);playing=false;b.active=false;document.getElementById('fs').textContent=score;document.getElementById('over').style.display='flex'}},1000)}

// input
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{if(!playing||b.active)return;cv.setPointerCapture(e.pointerId);const p=pos(e);drag={sx:p.x,sy:p.y,cx:p.x,cy:p.y}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);drag.cx=p.x;drag.cy=p.y});
cv.addEventListener('pointerup',()=>{if(!drag)return;const v=power();drag=null;if(Math.hypot(v.x,v.y)<2)return;b.vx=v.x;b.vy=v.y;b.active=true;b.frames=0});
cv.addEventListener('pointercancel',()=>drag=null);
function power(){let x=(drag.sx-drag.cx)*0.13,y=(drag.sy-drag.cy)*0.13;const m=Math.hypot(x,y);if(m>17){x*=17/m;y*=17/m}return{x,y}}

// physics
function hitPoint(cx,cy,r,e){const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy),m=R+r;if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=cx+nx*m;b.y=cy+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;b.vx*=.985;b.vy*=.985;if(Math.abs(vn)>1)b.hit=true}}}
function hitRect(x,w,t,bt,k){const cx=Math.max(x,Math.min(b.x,x+w)),cy=Math.max(t,Math.min(b.y,bt));let dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);if(d<R){if(d===0){dx=-1;dy=0;d=1}const nx=dx/d,ny=dy/d;b.x=cx+nx*R;b.y=cy+ny*R;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=k*vn*nx;b.vy-=k*vn*ny;b.vy*=.97;return true}}return false}
function hitBoard(){if(hitRect(BB.x,BB.w,BB.t,BB.b,1.6))b.hit=true}
const COLS=['#e63946','#2a9d8f','#ffd23f','#8e7dff','#3b82f6','#ff7ac6','#9ad14b','#06b6d4'],fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),NAMES=['Bryan','Philip','Vincent','Joe','Kyle','Rafael','Gab','Ken'],CHEER=['Ayos!','Swish!','Galing!','Sheesh!'],AWW=['Aww!','Sayang!','Next na!','Kaya mo yan!'];
let cheer=0,say=null;
function react(m){const v=NAMES.map((_,i)=>i).filter(i=>i!==pi&&i!==di);say={i:v[Math.floor(Math.random()*v.length)],t:m[Math.floor(Math.random()*m.length)],life:70}}
function endShot(){if(!b.scored)react(b.blocked?['Tinapon!','Depensa!']:AWW);resetBall()}
function defPos(){const s=SPOTS[spot],t=performance.now();return{x:s.x+48+Math.sin(t/500)*8,j:Math.max(0,Math.sin(t/700))*14}}
function hitDef(){const d=defPos();if(hitRect(d.x-8,16,300-d.j,420-d.j,1.8)){b.hit=true;if(!b.blocked){b.blocked=true;pop={t:'BLOCK!',life:50,c:'255,80,80'}}}}
function drawCrowd(){
  ctx.fillStyle='#2b2b3a';ctx.fillRect(0,300,W,60);ctx.fillStyle='#3a3a4d';ctx.fillRect(0,300,W,6);
  const cols=COLS,t=performance.now();
  ctx.textAlign='center';
  for(let i=0;i<NAMES.length;i++){if(i===pi||i===di)continue;
    const x=32+i*55,y=358+(cheer>.05?-Math.abs(Math.sin(t/110+i))*10*cheer:0);
    ctx.fillStyle=cols[i];ctx.fillRect(x-20,y-26,40,26);
    ctx.fillStyle='#f1c27d';ctx.beginPath();ctx.arc(x,y-34,9,0,7);ctx.fill();
    if(cheer>.05){ctx.strokeStyle=cols[i];ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-18,y-22);ctx.lineTo(x-24,y-48);ctx.moveTo(x+18,y-22);ctx.lineTo(x+24,y-48);ctx.stroke()}
    ctx.fillStyle='#fff';ctx.font='bold 10px Segoe UI,Arial';ctx.fillText(NAMES[i],x,y-9);
  }
  cheer*=.98;
}
function drawDef(){
  const d=defPos(),x=d.x,f=420-d.j;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,420,14,5,0,0,7);ctx.fill();
  ctx.strokeStyle=COLS[di];ctx.fillStyle=COLS[di];ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,f-80);ctx.lineTo(x,f-40);ctx.moveTo(x,f-40);ctx.lineTo(x-7,f);ctx.moveTo(x,f-40);ctx.lineTo(x+7,f);
  ctx.moveTo(x,f-76);ctx.lineTo(x-7,f-118);ctx.moveTo(x,f-76);ctx.lineTo(x+7,f-118);ctx.stroke();
  ctx.fillStyle='#f1c27d';ctx.beginPath();ctx.arc(x,f-91,9,0,7);ctx.fill();
  ctx.lineCap='butt';ctx.fillStyle='#fff';ctx.font='bold 10px Segoe UI,Arial';ctx.textAlign='center';ctx.fillText(NAMES[di],x,f-124);
}
function drawSay(){
  if(!say)return;const x=32+say.i*55,m=NAMES[say.i]+': '+say.t;
  ctx.font='bold 12px Segoe UI,Arial';ctx.textAlign='center';const w=ctx.measureText(m).width+14,cx=Math.max(w/2+2,Math.min(W-w/2-2,x));
  ctx.fillStyle='rgba(255,255,255,'+Math.min(1,say.life/15)+')';ctx.fillRect(cx-w/2,268,w,20);
  ctx.fillStyle='#111';ctx.fillText(m,cx,283);if(--say.life<=0)say=null;
}
function hitDefDummy(){}
function step(dt){
  const py=b.y;b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vx*dt*.06;
  hitBoard();hitDef();hitPoint(RIM.fx,RIM.y,3,.5);hitPoint(RIM.bx,RIM.y,3,.5);
  if(b.y>GY-R){b.y=GY-R;if(b.vy>1.2){b.vy*=-.6;b.vx*=.8;if(!b.landed){b.landed=true;b.landT=performance.now()}}else{b.vy=0;b.vx*=.95;if(!b.landed){b.landed=true;b.landT=performance.now()}}}
  if(!b.scored&&py<RIM.y&&b.y>=RIM.y&&b.vy>0&&b.x>RIM.fx&&b.x<RIM.bx){
    b.scored=true;const p=SPOTS[spot].pts;score+=p;document.getElementById('sc').textContent=score;sway=1;cheer=1;react(CHEER);
    pop={t:(b.hit?'':'SWISH! ')+'+'+p,life:50};
  }
}
function update(){
  if(!playing||!b.active)return;
  for(let i=0;i<4;i++)step(.25);
  b.frames++;
  if((b.landed&&performance.now()-b.landT>600)||b.x<-40||b.x>W+40||b.frames>300)endShot();
}

// drawing
function ell(x,y,rx,ry,a,bb){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,a,bb);ctx.stroke()}
function drawCourt(){
  let g=ctx.createLinearGradient(0,0,W,360);g.addColorStop(0,'#1a2a6c');g.addColorStop(.6,'#b21f1f');g.addColorStop(1,'#fdbb2d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawCrowd();
  // floor
  ctx.fillStyle='#c8631f';ctx.fillRect(0,360,W,120);
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,360);ctx.lineTo(x,H);ctx.stroke()}
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,360);ctx.lineTo(W,360);ctx.stroke();
  // boundary lines
  ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,368);ctx.lineTo(436,368);ctx.lineTo(436,474);ctx.lineTo(0,474);ctx.stroke();
  // paint
  ctx.fillStyle='rgba(140,30,20,.35)';ctx.fillRect(300,390,136,60);
  ctx.strokeRect(300,390,136,60);
  ell(300,420,20,30,-Math.PI/2,Math.PI/2);
  ctx.setLineDash([5,5]);ell(300,420,20,30,Math.PI/2,Math.PI*1.5);ctx.setLineDash([]);
  // three-point line
  ctx.beginPath();ctx.moveTo(436,376);ctx.lineTo(330,376);ctx.stroke();
  ctx.beginPath();ctx.moveTo(436,464);ctx.lineTo(330,464);ctx.stroke();
  ell(330,420,170,44,Math.PI/2,Math.PI*1.5);
  // center logo
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.font='900 38px Segoe UI,Arial';ctx.textAlign='center';ctx.fillText('VCA',225,433);
  // spot markers
  for(const k in SPOTS){const s=SPOTS[k];ctx.fillStyle=k===spot?'#fc0':'rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(s.x-16,420,12,5,0,0,7);ctx.fill()}
}
function drawHoop(){
  ctx.fillStyle='#444';ctx.fillRect(441,150,8,218);ctx.fillRect(418,150,24,8);
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.strokeStyle='#333';ctx.lineWidth=2;
  ctx.fillRect(BB.x,BB.t,BB.w,BB.b-BB.t);ctx.strokeRect(BB.x,BB.t,BB.w,BB.b-BB.t);
  ctx.strokeStyle='#ff3300';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(RIM.fx,RIM.y);ctx.lineTo(RIM.bx,RIM.y);ctx.stroke();
  ctx.fillStyle='#ff3300';ctx.beginPath();ctx.arc(RIM.fx,RIM.y,3.5,0,7);ctx.fill();
}
function drawNet(){
  const sw=Math.sin(performance.now()/60)*sway*5,n=6,top=RIM.y+2,bot=RIM.y+36;
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.2;
  for(let i=0;i<=n;i++){const tx=RIM.fx+(RIM.bx-RIM.fx)*i/n,bx=374+(398-374)*i/n+sw;
    ctx.beginPath();ctx.moveTo(tx,top);ctx.lineTo(bx,bot);ctx.stroke();
    if(i<n){const tx2=RIM.fx+(RIM.bx-RIM.fx)*(i+1)/n,bx2=374+(398-374)*(i+1)/n+sw;ctx.beginPath();ctx.moveTo(tx,top);ctx.lineTo(bx2,bot);ctx.moveTo(tx2,top);ctx.lineTo(bx,bot);ctx.stroke()}}
  for(let k=1;k<4;k++){const f=k/4,y=top+(bot-top)*f,l=RIM.fx+(374-RIM.fx)*f+sw*f,r=RIM.bx+(398-RIM.bx)*f+sw*f;ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(r,y);ctx.stroke()}
  sway*=.95;
}
function drawPlayer(){
  const s=SPOTS[spot],px=s.x-16;
  ctx.strokeStyle=COLS[pi];ctx.fillStyle=COLS[pi];ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px,364);ctx.lineTo(px,396);ctx.moveTo(px,396);ctx.lineTo(px-6,420);ctx.moveTo(px,396);ctx.lineTo(px+6,420);
  ctx.moveTo(px,372);ctx.lineTo(px+12,350);ctx.stroke();
  ctx.fillStyle='#f1c27d';ctx.beginPath();ctx.arc(px,354,8,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px Segoe UI,Arial';ctx.textAlign='center';ctx.fillText(NAMES[pi],px,438);
  ctx.lineCap='butt';
}
function drawBall(){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);
  const g=ctx.createRadialGradient(-4,-4,2,0,0,R);g.addColorStop(0,'#ff8a1f');g.addColorStop(1,'#b33600');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  ctx.strokeStyle='#3a1500';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-R,0);ctx.lineTo(R,0);ctx.moveTo(0,-R);ctx.lineTo(0,R);ctx.stroke();
  ctx.beginPath();ctx.arc(-R*1.2,0,R*.85,-1,1);ctx.stroke();ctx.beginPath();ctx.arc(R*1.2,0,R*.85,Math.PI-1,Math.PI+1);ctx.stroke();
  ctx.restore();
}
function drawAim(){
  if(!drag||b.active)return;
  const v=power();let x=b.x,y=b.y,vx=v.x,vy=v.y;
  for(let i=0;i<16;i++){for(let k=0;k<6;k++){vy+=G*.25;x+=vx*.25;y+=vy*.25}
    ctx.fillStyle='rgba(255,255,255,'+(0.9-i*.05)+')';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}
}
function draw(){
  ctx.clearRect(0,0,W,H);drawCourt();drawHoop();drawPlayer();drawDef();
  if(playing||!b.active)drawBall();
  drawNet();drawAim();drawSay();
  if(pop){ctx.fillStyle='rgba('+(pop.c||'0,255,100')+','+Math.min(1,pop.life/20)+')';ctx.font='bold 26px Segoe UI,Arial';ctx.textAlign='center';ctx.fillText(pop.t,330,140-(50-pop.life)*.6);if(--pop.life<=0)pop=null}
}
function loop(){update();draw();requestAnimationFrame(loop)}
const ps=document.getElementById('ps'),ds=document.getElementById('ds');
NAMES.forEach((n,i)=>{ps.add(new Option(n,i));ds.add(new Option(n,i))});
ps.value=pi;ds.value=di;
ps.onchange=()=>{pi=+ps.value;if(di===pi){di=(pi+1)%NAMES.length;ds.value=di}};
ds.onchange=()=>{di=+ds.value;if(pi===di){pi=(di+1)%NAMES.length;ps.value=pi}};
setSpot('wing');loop();
</script>
</body>
</html>
