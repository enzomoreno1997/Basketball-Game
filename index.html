<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3-Point Basketball Shootout Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 480px;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            border: 3px solid #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        /* HUD / Scoreboard */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
            z-index: 10;
        }
        .hud-item span {
            color: #ffcc00;
        }
        /* Court Graphics */
        .court-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: #d35400;
            border-top: 3px solid #fff;
        }
        .three-point-arc {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 220px;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        /* Hoop & Backboard */
        #backboard {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 4px;
        }
        #rim {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 12px;
            border: 3px solid #ff3300;
            border-radius: 50%;
            z-index: 5;
        }
        #net {
            position: absolute;
            top: 114px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 35px;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.7), rgba(255,255,255,0.7) 4px, transparent 4px, transparent 8px);
            clip-path: polygon(10% 0%, 90% 0%, 75% 100%, 25% 100%);
            z-index: 4;
        }
        /* Basketball */
        #ball {
            position: absolute;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #ff7700, #b33600);
            border-radius: 50%;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.5), 0 3px 6px rgba(0,0,0,0.4);
            display: none;
            z-index: 6;
        }
        /* Controls Panel */
        #controls-panel {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 0 10px;
        }
        .control-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        button, select {
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #ff6600;
            color: white;
        }
        select { background: #333; color: #fff; border: 1px solid #777; flex: 1; }
        
        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .overlay h2 { font-size: 2rem; margin-bottom: 10px; color: #ffcc00; }
        .overlay p { font-size: 0.95rem; margin-bottom: 20px; color: #ccc; line-height: 1.4; }
        
        #instructions {
            margin-top: 5px;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <h1>3-Point Shootout</h1>

    <div id="game-container">
        <!-- HUD / Score & Timer -->
        <div id="hud">
            <div class="hud-item">Score: <span id="score">0</span></div>
            <div class="hud-item">Spot: <span id="current-spot">Top</span></div>
            <div class="hud-item">Time: <span id="timer">45</span>s</div>
        </div>

        <!-- Court Elements -->
        <div id="backboard"></div>
        <div id="rim"></div>
        <div id="net"></div>

        <div class="court-floor">
            <div class="three-point-arc"></div>
        </div>

        <!-- The Ball -->
        <div id="ball"></div>

        <!-- Start / Game Over Screens -->
        <div id="start-screen" class="overlay">
            <h2>3-Point Contest</h2>
            <p>I-swipe o i-drag ang daliri pataas o paitaas sa screen para i-adjust ang lakas at anggulo ng tira bago maubos ang 45 segundo!</p>
            <button onclick="startGame()">Simulan ang Laro</button>
        </div>

        <div id="gameover-screen" class="overlay" style="display: none;">
            <h2>Tapos na ang Oras!</h2>
            <p>Final Score mo: <span id="final-score" style="color: #ffcc00; font-weight: bold;">0</span></p>
            <button onclick="startGame()">Maglaro Uli</button>
        </div>
    </div>

    <!-- Controls & Options -->
    <div id="controls-panel">
        <div class="control-row">
            <select id="spot-select" onchange="changeSpot()">
                <option value="left-corner">Left Corner</option>
                <option value="left-wing">Left Wing</option>
                <option value="top" selected>Top of the Key</option>
                <option value="right-wing">Right Wing</option>
                <option value="right-corner">Right Corner</option>
            </select>
        </div>
    </div>
    <div id="instructions">💡 I-drag at i-release ang bola para tumira sa ring!</div>

    <script>
        const container = document.getElementById('game-container');
        const ball = document.getElementById('ball');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const finalScoreDisplay = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const spotSelect = document.getElementById('spot-select');
        const currentSpotLabel = document.getElementById('current-spot');

        let score = 0;
        let timeLeft = 45;
        let gameInterval = null;
        let isPlaying = false;
        let isShotActive = false;

        // Relative coordinates para sa 450x480 container size
        const spots = {
            'left-corner': { x: 60, y: 400, name: 'Left Corner' },
            'left-wing': { x: 120, y: 360, name: 'Left Wing' },
            'top': { x: 225, y: 340, name: 'Top' },
            'right-wing': { x: 330, y: 360, name: 'Right Wing' },
            'right-corner': { x: 390, y: 400, name: 'Right Corner' }
        };

        let currentSpotKey = 'top';
        let ballPos = { x: spots['top'].x, y: spots['top'].y };

        let velocity = { x: 0, y: 0 };
        let gravity = 0.35;

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            score = 0;
            timeLeft = 45;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            isPlaying = true;
            isShotActive = false;
            resetBall();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
            ball.style.display = 'none';
        }

        function changeSpot() {
            currentSpotKey = spotSelect.value;
            currentSpotLabel.textContent = spots[currentSpotKey].name;
            if (!isShotActive) {
                resetBall();
            }
        }

        function resetBall() {
            const spot = spots[currentSpotKey];
            ballPos.x = spot.x;
            ballPos.y = spot.y;
            ball.style.display = 'block';
            ball.style.left = (ballPos.x - 14) + 'px';
            ball.style.top = (ballPos.y - 14) + 'px';
            ball.style.transform = 'scale(1)';
            isShotActive = false;
        }

        // Unified Handle Start (Mouse & Touch)
        function handleDragStart(clientX, clientY) {
            if (!isPlaying || isShotActive) return;
            isDragging = true;
            const rect = container.getBoundingClientRect();
            dragStart.x = clientX - rect.left;
            dragStart.y = clientY - rect.top;
        }

        // Unified Handle End (Mouse & Touch)
        function handleDragEnd(clientX, clientY) {
            if (!isDragging || !isPlaying || isShotActive) return;
            isDragging = false;
            const rect = container.getBoundingClientRect();
            const dragEndX = clientX - rect.left;
            const dragEndY = clientY - rect.top;

            const powerX = (dragStart.x - dragEndX) * 0.12;
            const powerY = (dragStart.y - dragEndY) * 0.12;

            shootBall(powerX, powerY);
        }

        // Mouse Events
        container.addEventListener('mousedown', (e) => handleDragStart(e.clientX, e.clientY));
        window.addEventListener('mouseup', (e) => handleDragEnd(e.clientX, e.clientY));

        // Touch Events for Mobile
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handleDragStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                handleDragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        }, { passive: true });

        function shootBall(vx, vy) {
            isShotActive = true;
            velocity.x = vx;
            velocity.y = vy;

            let hasCheckedScore = false;

            function updatePhysics() {
                if (!isPlaying) return;

                ballPos.x += velocity.x;
                ballPos.y += velocity.y;
                velocity.y += gravity;

                ball.style.left = (ballPos.x - 14) + 'px';
                ball.style.top = (ballPos.y - 14) + 'px';
                
                let depthScale = Math.max(0.4, 1 - (380 - ballPos.y) / 400);
                ball.style.transform = `scale(${depthScale})`;

                // Rim Check (X: 200 to 250, Y: 100 to 112)
                if (!hasCheckedScore && ballPos.y >= 100 && ballPos.y <= 112) {
                    if (ballPos.x >= 210 && ballPos.x <= 240 && velocity.y > 0) {
                        hasCheckedScore = true;
                        score += 3;
                        scoreDisplay.textContent = score;
                        scoreDisplay.style.color = '#00ff00';
                        setTimeout(() => scoreDisplay.style.color = '#ffcc00', 300);
                    }
                }

                if (ballPos.y > 500 || ballPos.x < 0 || ballPos.x > 450) {
                    setTimeout(resetBall, 300);
                    return;
                }

                requestAnimationFrame(updatePhysics);
            }

            requestAnimationFrame(updatePhysics);
        }

        resetBall();
    </script>
</body>
</html>
