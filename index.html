<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VCA 3-Point Shootout Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 480px;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            border: 3px solid #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        /* HUD / Scoreboard */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
            z-index: 10;
        }
        .hud-item span {
            color: #ffcc00;
        }
        /* Side-View Court Graphics */
        .court-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: #d35400;
            border-top: 4px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* VCA Logo sa Sahig */
        #vca-logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 8px;
            text-transform: uppercase;
            user-select: none;
        }
        
        /* Eksaktong Alignment ng Backboard at Rim */
        #backboard {
            position: absolute;
            top: 130px;
            right: 30px;
            width: 12px;
            height: 75px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #333;
            border-radius: 2px;
            z-index: 4;
        }
        #rim {
            position: absolute;
            top: 185px;
            right: 42px;
            width: 36px;
            height: 12px;
            border: 3px solid #ff3300;
            border-radius: 4px;
            z-index: 6;
        }
        #net {
            position: absolute;
            top: 196px;
            right: 44px;
            width: 32px;
            height: 38px;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.8), rgba(255,255,255,0.8) 3px, transparent 3px, transparent 6px);
            clip-path: polygon(0% 0%, 100% 0%, 75% 100%, 25% 100%);
            z-index: 3;
        }

        /* Basketball */
        #ball {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #ff7700, #b33600);
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4);
            display: none;
            z-index: 7;
        }

        /* Controls Panel */
        #controls-panel {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 0 10px;
        }
        .control-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        button, select {
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #ff6600;
            color: white;
        }
        select { background: #333; color: #fff; border: 1px solid #777; flex: 1; }
        
        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .overlay h2 { font-size: 2rem; margin-bottom: 10px; color: #ffcc00; }
        .overlay p { font-size: 0.95rem; margin-bottom: 20px; color: #ccc; line-height: 1.4; }
        
        #instructions {
            margin-top: 5px;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <h1>VCA 3-Point Shootout</h1>

    <div id="game-container">
        <!-- HUD / Score & Timer -->
        <div id="hud">
            <div class="hud-item">Score: <span id="score">0</span></div>
            <div class="hud-item">Range: <span id="current-spot">Wing 3PT</span></div>
            <div class="hud-item">Time: <span id="timer">45</span>s</div>
        </div>

        <!-- Side Court Elements -->
        <div id="backboard"></div>
        <div id="rim"></div>
        <div id="net"></div>

        <div class="court-floor">
            <div id="vca-logo">VÇA</div>
        </div>

        <!-- The Ball -->
        <div id="ball"></div>

        <!-- Start / Game Over Screens -->
        <div id="start-screen" class="overlay">
            <h2>VCA Shootout</h2>
            <p>Perfect na ang ring alignment at collision! Subukan nang mag-shoot sa pamamagitan ng pag-drag at pag-release.</p>
            <button onclick="startGame()">Simulan ang Laro</button>
        </div>

        <div id="gameover-screen" class="overlay" style="display: none;">
            <h2>Tapos na ang Oras!</h2>
            <p>Final Score mo: <span id="final-score" style="color: #ffcc00; font-weight: bold;">0</span></p>
            <button onclick="startGame()">Maglaro Uli</button>
        </div>
    </div>

    <!-- Controls & Options -->
    <div id="controls-panel">
        <div class="control-row">
            <select id="spot-select" onchange="changeSpot()">
                <option value="short">Short Corner</option>
                <option value="wing" selected>Wing 3-Pointer</option>
                <option value="deep">Deep Logo 3</option>
            </select>
        </div>
    </div>
    <div id="instructions">💡 I-drag at bitawan ang bola para pumasok sa ring!</div>

    <script>
        const container = document.getElementById('game-container');
        const ball = document.getElementById('ball');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const finalScoreDisplay = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const spotSelect = document.getElementById('spot-select');
        const currentSpotLabel = document.getElementById('current-spot');

        let score = 0;
        let timeLeft = 45;
        let gameInterval = null;
        let isPlaying = false;
        let isShotActive = false;

        const spots = {
            'short': { x: 220, y: 390, name: 'Short Corner' },
            'wing': { x: 120, y: 390, name: 'Wing 3PT' },
            'deep': { x: 60, y: 390, name: 'Deep Logo 3' }
        };

        let currentSpotKey = 'wing';
        let ballPos = { x: spots['wing'].x, y: spots['wing'].y };

        let velocity = { x: 0, y: 0 };
        let gravity = 0.35;

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            score = 0;
            timeLeft = 45;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            isPlaying = true;
            isShotActive = false;
            resetBall();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
            ball.style.display = 'none';
        }

        function changeSpot() {
            currentSpotKey = spotSelect.value;
            currentSpotLabel.textContent = spots[currentSpotKey].name;
            if (!isShotActive) {
                resetBall();
            }
        }

        function resetBall() {
            const spot = spots[currentSpotKey];
            ballPos.x = spot.x;
            ballPos.y = spot.y;
            ball.style.display = 'block';
            ball.style.left = (ballPos.x - 12) + 'px';
            ball.style.top = (ballPos.y - 12) + 'px';
            isShotActive = false;
        }

        function handleDragStart(clientX, clientY) {
            if (!isPlaying || isShotActive) return;
            isDragging = true;
            const rect = container.getBoundingClientRect();
            dragStart.x = clientX - rect.left;
            dragStart.y = clientY - rect.top;
        }

        function handleDragEnd(clientX, clientY) {
            if (!isDragging || !isPlaying || isShotActive) return;
            isDragging = false;
            const rect = container.getBoundingClientRect();
            const dragEndX = clientX - rect.left;
            const dragEndY = clientY - rect.top;

            const powerX = (dragStart.x - dragEndX) * 0.135;
            const powerY = (dragStart.y - dragEndY) * 0.135;

            shootBall(powerX, powerY);
        }

        container.addEventListener('mousedown', (e) => handleDragStart(e.clientX, e.clientY));
        window.addEventListener('mouseup', (e) => handleDragEnd(e.clientX, e.clientY));

        container.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handleDragStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                handleDragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        }, { passive: true });

        function shootBall(vx, vy) {
            isShotActive = true;
            velocity.x = vx;
            velocity.y = vy;

            let hasCheckedScore = false;
            let hasHitRim = false;

            function updatePhysics() {
                if (!isPlaying) return;

                ballPos.x += velocity.x;
                ballPos.y += velocity.y;
                velocity.y += gravity;

                ball.style.left = (ballPos.x - 12) + 'px';
                ball.style.top = (ballPos.y - 12) + 'px';

                // Rim Coordinates Mapping (Tamang-tama sa mismong pwesto ng orange rim sa screen)
                const rimLeft = 415;
                const rimRight = 450;
                const rimTop = 185;

                // Physics check para sa pagtama sa rim (Bounce effect)
                if (!hasHitRim && velocity.y > 0 && ballPos.y >= rimTop - 5 && ballPos.y <= rimTop + 5) {
                    if (ballPos.x >= rimLeft - 10 && ballPos.x <= rimLeft + 5) {
                        // Tumaas nang kaunti o nag-bounce mula sa unahan ng ring
                        velocity.y = -velocity.y * 0.35;
                        velocity.x = -velocity.x * 0.5;
                        hasHitRim = true;
                    }
                }

                // Check kung pumasok sa mismong butas ng ring (Swish / Score)
                if (!hasCheckedScore && ballPos.y >= rimTop + 2 && ballPos.y <= rimTop + 16) {
                    if (ballPos.x >= rimLeft + 4 && ballPos.x <= rimRight - 5 && velocity.y > 0) {
                        hasCheckedScore = true;
                        score += 3;
                        scoreDisplay.textContent = score;
                        scoreDisplay.style.color = '#00ff00';
                        setTimeout(() => scoreDisplay.style.color = '#ffcc00', 300);
                    }
                }

                // I-reset ang bola kapag lumagpas na sa screen boundaries
                if (ballPos.y > 500 || ballPos.x < 0 || ballPos.x > 450) {
                    setTimeout(resetBall, 250);
                    return;
                }

                requestAnimationFrame(updatePhysics);
            }

            requestAnimationFrame(updatePhysics);
        }

        resetBall();
    </script>
</body>
</html>
